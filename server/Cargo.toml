[package]
name = "remote-server"
version = "0.1.0"
edition = "2021"

[dependencies]
remote-common = { path = "../common" }
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
