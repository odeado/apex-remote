<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApexRemote Agent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barra de título personalizada (frameless window) -->
  <div class="titlebar" id="titlebar">
    <div class="titlebar-logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <polygon points="13,2 3,14 12,14 11,22 21,10 12,10" fill="#4f8ef7" stroke="#4f8ef7" stroke-width="1"/>
      </svg>
      <span>ApexRemote</span>
    </div>
    <div class="titlebar-actions">
      <button class="tb-btn" id="btn-min" title="Minimizar">—</button>
      <button class="tb-btn tb-close" id="btn-close" title="Cerrar">✕</button>
    </div>
  </div>

  <!-- Contenido principal -->
  <main>

    <!-- Estado de conexión -->
    <div class="status-bar" id="status-bar">
      <div class="status-dot" id="status-dot"></div>
      <span class="status-text" id="status-text">Conectando...</span>
    </div>

    <!-- ID de conexión -->
    <section class="card">
      <div class="card-label">ID de conexión</div>
      <div class="id-display" id="id-display">— — —</div>
      <button class="copy-btn" id="btn-copy-id" title="Copiar ID">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        Copiar
      </button>
    </section>

    <!-- PIN -->
    <section class="card card-row">
      <div style="flex:1">
        <div class="card-label">PIN de seguridad</div>
        <div class="pin-display" id="pin-display">····</div>
      </div>
      <div class="pin-toggle-wrap">
        <button class="icon-btn" id="btn-pin-toggle" title="Mostrar/Ocultar PIN">
          <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
        <button class="icon-btn" id="btn-copy-pin" title="Copiar PIN">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- Stats (solo visible cuando transmite) -->
    <div class="stats-bar hidden" id="stats-bar">
      <span id="stat-fps">— FPS</span>
      <span class="stats-sep">·</span>
      <span id="stat-res">—</span>
      <span class="stats-sep">·</span>
      <span id="stat-kb">— KB/f</span>
    </div>

    <!-- Aviso de archivo recibido -->
    <div class="file-toast hidden" id="file-toast">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2">
        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
        <polyline points="13 2 13 9 20 9"/>
      </svg>
      <span id="file-toast-text">Archivo recibido</span>
    </div>

    <!-- Instrucciones -->
    <div class="hint" id="hint-text">
      Comparte tu <strong>ID</strong> y <strong>PIN</strong><br>con quien necesite acceder a tu PC.
    </div>

    <!-- Selector de calidad -->
    <section class="quality-section">
      <div class="card-label">Calidad de transmisión</div>
      <div class="quality-row">
        <button class="q-btn" data-w="960"  data-h="540"  data-q="35">540p Rápida</button>
        <button class="q-btn active" data-w="1280" data-h="720"  data-q="50">720p Normal</button>
        <button class="q-btn" data-w="1920" data-h="1080" data-q="70">1080p HD</button>
      </div>
    </section>

    <!-- Relay info -->
    <div class="relay-info" id="relay-info">Servidor: —</div>

  </main>

  <script>
    let agentId  = '------';
    let agentPin = '----';
    let pinVisible = false;

    const $ = (id) => document.getElementById(id);

    function formatId(id) {
      return id.slice(0,3) + ' · ' + id.slice(3);
    }

    function updatePinDisplay() {
      $('pin-display').textContent = pinVisible ? agentPin : '· '.repeat(agentPin.length).trim();
    }

    function setStatus(s) {
      const dot   = $('status-dot');
      const text  = $('status-text');
      const hint  = $('hint-text');
      const stats = $('stats-bar');
      dot.className = 'status-dot ' + s;
      switch(s) {
        case 'connecting':
          text.textContent = 'Conectando al servidor...';
          hint.innerHTML   = 'Estableciendo conexión<br>con el servidor relay.';
          stats.classList.add('hidden');
          break;
        case 'waiting':
          text.textContent = 'En línea — esperando controlador';
          hint.innerHTML   = 'Comparte tu <strong>ID</strong> y <strong>PIN</strong><br>con quien necesite acceder a tu PC.';
          stats.classList.add('hidden');
          break;
        case 'streaming':
          text.textContent = '🔴 Sesión activa';
          hint.innerHTML   = 'Tu pantalla está siendo<br>controlada en este momento.';
          stats.classList.remove('hidden');
          break;
        case 'disconnected':
          text.textContent = 'Sin conexión — reconectando...';
          hint.innerHTML   = 'Intentando reconectar<br>al servidor...';
          stats.classList.add('hidden');
          break;
      }
    }

    // ── IPC desde main ────────────────────────────────────────────────────────
    window.electronAPI.onInit(({ id, pin, relay }) => {
      agentId  = id;
      agentPin = pin;
      $('id-display').textContent = formatId(id);
      $('relay-info').textContent = 'Servidor: ' + relay;
      updatePinDisplay();
    });

    window.electronAPI.onStatus((s) => setStatus(s));

    window.electronAPI.onStats((stats) => {
      if (!stats) return;
      $('stat-fps').textContent = stats.fps + ' FPS';
      $('stat-res').textContent = stats.w + '×' + stats.h;
      $('stat-kb').textContent  = stats.kb + ' KB/f';
    });

    window.electronAPI.onFileReceived(({ name, size }) => {
      const kb = size > 1048576 ? (size/1048576).toFixed(1)+' MB' : Math.round(size/1024)+' KB';
      $('file-toast-text').textContent = '📁 ' + name + ' (' + kb + ') guardado';
      const toast = $('file-toast');
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 5000);
    });

    // ── Cursor: posición actual en píxeles del canvas ─────────────────────────
    let cursorX = 0, cursorY = 0;

    window.electronAPI.onCursorUpdate(({ cx, cy }) => {
      cursorX = cx; cursorY = cy;
    });

    // Dibuja flecha estilo cursor Windows sobre el canvas ya capturado
    function drawCursorArrow(ctx, x, y) {
      ctx.save();
      ctx.translate(x, y);
      // Sombra para contraste en cualquier fondo
      ctx.shadowColor = 'rgba(0,0,0,0.6)';
      ctx.shadowBlur  = 3;
      ctx.shadowOffsetX = 1;
      ctx.shadowOffsetY = 1;
      // Forma de flecha (arrow cursor clásico)
      ctx.beginPath();
      ctx.moveTo(0,  0);
      ctx.lineTo(0,  19);
      ctx.lineTo(4,  14);
      ctx.lineTo(8,  22);
      ctx.lineTo(11, 20);
      ctx.lineTo(7,  12);
      ctx.lineTo(13, 12);
      ctx.closePath();
      ctx.fillStyle   = '#ffffff';
      ctx.fill();
      ctx.shadowBlur  = 0;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;
      ctx.strokeStyle = '#222222';
      ctx.lineWidth   = 1.2;
      ctx.stroke();
      ctx.restore();
    }

    // ── Captura de pantalla vía MediaStream (alta velocidad) ──────────────────
    let captureActive = false;
    let captureStream = null;
    let captureVideo  = null;
    let captureCanvas = null;
    let captureCtx    = null;
    let capQ          = { w: 1280, h: 720, q: 0.35 };

    async function startCapture(quality) {
      if (quality) capQ = { w: quality.w, h: quality.h, q: Math.min(0.45, quality.q / 100) };
      await stopCapture();

      try {
        const sources = await window.electronAPI.getSources();
        if (!sources || !sources.length) {
          console.warn('[Capture] No screen sources found');
          return;
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            mandatory: {
              chromeMediaSource:   'desktop',
              chromeMediaSourceId: sources[0].id,
              maxWidth:    capQ.w,
              maxHeight:   capQ.h,
              maxFrameRate: 30,
            }
          }
        });

        captureStream = stream;
        captureVideo  = document.createElement('video');
        captureVideo.srcObject = stream;
        captureVideo.muted     = true;

        // Esperar a que el video tenga datos antes de empezar el loop
        await new Promise((resolve, reject) => {
          captureVideo.onloadeddata = resolve;
          captureVideo.onerror      = reject;
          captureVideo.play().catch(reject);
        });

        captureCanvas = document.createElement('canvas');
        captureCanvas.width  = capQ.w;
        captureCanvas.height = capQ.h;
        captureCtx = captureCanvas.getContext('2d', { alpha: false });

        captureActive = true;
        captureLoop();
      } catch (err) {
        console.error('[Capture] Error:', err);
      }
    }

    // Rate limiting para envio JPEG fluido sin sobrecargar el buffer TCP
    let encoding = false;
    let lastFrameTime = 0;

    function captureLoop() {
      if (!captureActive) return;

      // Dibujar frame actual del video
      captureCtx.drawImage(captureVideo, 0, 0, captureCanvas.width, captureCanvas.height);

      const now = performance.now();
      // Enviar a ~30 FPS máximos (33ms) para evitar congestión de red
      if (!encoding && (now - lastFrameTime >= 32)) {
        encoding = true;
        lastFrameTime = now;
        captureCanvas.toBlob(blob => {
          if (blob && captureActive) {
            blob.arrayBuffer().then(buf => {
              window.electronAPI.sendFrame(new Uint8Array(buf));
              encoding = false;
            });
          } else {
            encoding = false;
          }
        }, 'image/jpeg', capQ.q);
      }

      if (captureActive) requestAnimationFrame(captureLoop);
    }

    async function stopCapture() {
      captureActive = false;
      if (captureStream) {
        captureStream.getTracks().forEach(t => t.stop());
        captureStream = null;
      }
      captureVideo = null; captureCanvas = null; captureCtx = null;
    }

    window.electronAPI.onStartCapture((q) => startCapture(q));
    window.electronAPI.onStopCapture(() => stopCapture());
    window.electronAPI.onQualityChange((q) => {
      // Reiniciar captura con nueva calidad/resolución
      if (captureActive) startCapture(q);
    });

    // ── WebRTC: responder offer del viewer con video del canvas ───────────────
    let agentPC = null;

    window.electronAPI.onWebRTCOffer(async (offer) => {
      try {
        // Esperar a que el canvas esté listo (máx 5s)
        let tries = 0;
        while (!captureCanvas && tries < 50) {
          await new Promise(r => setTimeout(r, 100));
          tries++;
        }
        if (!captureCanvas) { console.warn('[WebRTC] canvas no disponible'); return; }

        if (agentPC) { try { agentPC.close(); } catch {} agentPC = null; }

        const config = { iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
        ]};
        agentPC = new RTCPeerConnection(config);

        // Añadir el stream del canvas como video track
        const stream = captureCanvas.captureStream(60);
        stream.getTracks().forEach(track => agentPC.addTrack(track, stream));

        agentPC.onicecandidate = (e) => {
          // Filtrar candidato "end-of-candidates" (sdpMid y sdpMLineIndex ambos null)
          if (e.candidate && (e.candidate.sdpMid !== null || e.candidate.sdpMLineIndex !== null)) {
            window.electronAPI.sendWebRTCICE(e.candidate);
          }
        };

        await agentPC.setRemoteDescription(new RTCSessionDescription(offer));
        const answer = await agentPC.createAnswer();
        await agentPC.setLocalDescription(answer);
        window.electronAPI.sendWebRTCAnswer(answer);

        console.log('[WebRTC] Answer enviado — video stream activo');
      } catch (err) {
        console.error('[WebRTC Agent]', err);
      }
    });

    window.electronAPI.onWebRTCICE((candidate) => {
      if (agentPC && candidate) {
        agentPC.addIceCandidate(new RTCIceCandidate(candidate)).catch(() => {});
      }
    });

    // ── Controles de ventana ──────────────────────────────────────────────────
    $('btn-min').addEventListener('click',   () => window.electronAPI.minimize());
    $('btn-close').addEventListener('click', () => window.electronAPI.close());

    // ── Copiar ────────────────────────────────────────────────────────────────
    function flashCopyBtn(btn, origHTML) {
      btn.textContent = '✓'; btn.style.color = '#22c55e';
      setTimeout(() => { btn.innerHTML = origHTML; btn.style.color = ''; }, 1500);
    }

    $('btn-copy-id').addEventListener('click', () => {
      navigator.clipboard.writeText(agentId);
      const orig = $('btn-copy-id').innerHTML;
      $('btn-copy-id').textContent = '✓'; $('btn-copy-id').style.color = '#22c55e';
      setTimeout(() => { $('btn-copy-id').innerHTML = orig; $('btn-copy-id').style.color = ''; }, 1500);
    });

    $('btn-copy-pin').addEventListener('click', () => {
      navigator.clipboard.writeText(agentPin);
    });

    $('btn-pin-toggle').addEventListener('click', () => {
      pinVisible = !pinVisible;
      updatePinDisplay();
      $('eye-icon').style.opacity = pinVisible ? '1' : '0.4';
    });

    // ── Calidad ───────────────────────────────────────────────────────────────
    document.querySelectorAll('.q-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        window.electronAPI.setQuality({
          w: +btn.dataset.w,
          h: +btn.dataset.h,
          q: +btn.dataset.q,
        });
      });
    });
  </script>
</body>
</html>
